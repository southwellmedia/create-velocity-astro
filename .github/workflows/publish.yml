name: Publish to npm

# Publishes when a version tag is pushed: bump package.json, merge to main, then
#   git tag v2.1.0 && git push origin v2.1.0
#
# Uses npm trusted publishing, so no token is stored here. On npmjs.com, the
# package's trusted publisher must name this repository and this workflow file.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets GitHub prove its identity to npm

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json and is on main
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      # prepublishOnly builds the CLI
      - name: Publish
        run: npm publish
